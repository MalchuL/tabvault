<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>TabVault fast save</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <main class="popup-shell">
      <div class="workspace-actions">
        <button
          id="open-workspace"
          class="workspace-link"
          type="button"
          title="Open the TabVault side panel in this browser window"
        >
          <span class="brand-mark" aria-hidden="true">▮</span>
          <span>Open TabVault workspace</span>
        </button>
        <button
          id="open-workspace-page"
          class="workspace-page-link"
          type="button"
          title="Open TabVault in a new tab"
          aria-label="Open TabVault in a new tab"
        >
          <span aria-hidden="true">↗</span>
        </button>
      </div>

      <section class="selection-panel" aria-labelledby="selection-title">
        <div class="eyebrow-row">
          <span class="eyebrow">Fast save</span>
          <span id="tab-count" class="count">Loading tabs…</span>
        </div>
        <h1 id="selection-title">Choose what to clear.</h1>
        <p id="selection-copy" class="selection-copy">
          Choose a tab set to save it to Inbox and close those tabs.
        </p>

        <div class="direction-group" aria-label="Choose tabs to save and close">
          <button
            class="direction-button"
            type="button"
            data-selection="left"
            title="Select every tab to the left of the active tab"
            aria-label="Select tabs to the left of the active tab"
          >
            <span class="arrow" aria-hidden="true">←</span>
            <span>Left <span data-selection-count="left">{0}</span></span>
          </button>
          <button
            class="direction-button is-active"
            type="button"
            data-selection="all"
            title="Select all tabs in the current browser window"
            aria-label="Select all tabs in the current browser window"
            aria-pressed="true"
          >
            <span class="arrow" aria-hidden="true">↔</span>
            <span>All <span data-selection-count="all">{0}</span></span>
          </button>
          <button
            class="direction-button"
            type="button"
            data-selection="right"
            title="Select every tab to the right of the active tab"
            aria-label="Select tabs to the right of the active tab"
          >
            <span class="arrow" aria-hidden="true">→</span>
            <span>Right <span data-selection-count="right">{0}</span></span>
          </button>
        </div>

        <button
          id="use-chrome-selection"
          class="selection-source"
          type="button"
          title="Use the tabs you have highlighted in Chrome instead of a directional selection"
        >
          Selected <span data-selection-count="chrome">{0}</span>
        </button>
        <p id="result" class="result" aria-live="polite" hidden></p>
      </section>
    </main>
    <script type="module" src="popup.js"></script>
  </body>
</html>
