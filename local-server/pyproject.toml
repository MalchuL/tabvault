[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tabvault-local-server"
version = "0.2.0"
description = "Local-first HTTP server for the TabVault Chrome extension and MCP service."
requires-python = ">=3.11"
dependencies = [
  "advanced-alchemy>=1.6",
  "aiosqlite>=0.21",
  "alembic>=1.16",
  "fastapi>=0.110",
  "httpx>=0.28",
  "mcp[cli]>=2.0.0",
  "nh3>=0.3",
  "pydantic-settings>=2.10",
  "readability-lxml>=0.8.4",
  "sqlalchemy[asyncio]>=2.0.43",
  "uvicorn[standard]>=0.29",
  "zvec>=0.6; platform_machine == 'x86_64' or platform_machine == 'AMD64' or platform_machine == 'aarch64' or platform_machine == 'arm64'",
]

[project.optional-dependencies]
semantic = ["sentence-transformers>=5.1", "torch>=2.9"]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cpu" }

[project.scripts]
tabvault-server = "api.main:main"
tabvault-mcp = "mcp_bridge.main:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[dependency-groups]
dev = [
    "mypy>=2.3.1",
    "pytest>=8.4",
    "pytest-asyncio>=1.1",
    "pytest-cov>=6.2",
    "ruff>=0.16.3",
]

[tool.pytest.ini_options]
addopts = "--cov --cov-report=term:skip-covered --cov-fail-under=90"
asyncio_mode = "auto"
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 100
extend-exclude = [".venv"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B", "SIM"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"

[tool.mypy]
files = ["src"]
python_version = "3.13"
check_untyped_defs = true
disallow_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_return_any = true
warn_unused_ignores = true
warn_unreachable = true
ignore_missing_imports = true
